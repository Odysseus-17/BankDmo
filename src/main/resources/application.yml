server:
    port: 8080
    error:
        include-message: always

spring:
    application:
        name: bckbank

    datasource:
        url: jdbc:mysql://localhost:3306/db_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD}
        driver-class-name: com.mysql.cj.jdbc.Driver
    jpa:
        hibernate:
            ddl-auto: update # en produccion va: validate
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect
app:
    jwt:
        secret: ${JWT_SECRET}
        expiration-ms: ${JWT_EXPIRATION_MS:86400000}
