server:
    port: 8081

spring:
    application:
        name: bckdbank

    datasource:
        # MySQL debe estar disponible antes de iniciar la aplicación.
        url: ${DB_URL:jdbc:mysql://localhost:3306/db_bank?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC}
        username: ${DB_USERNAME:root}
        password: ${DB_PASSWORD:root}
        driver-class-name: com.mysql.cj.jdbc.Driver

    jpa:
        hibernate:
            ddl-auto: update
        show-sql: true
        properties:
            hibernate:
                format_sql: true
                dialect: org.hibernate.dialect.MySQLDialect

app:
    jwt:
        secret: 404E635266556A586E3272357538782F413F4428472B4B6250645367566B5970
        expiration-ms: 86400000
    exchange-rate:
        # API pública de tasas de cambio (sin clave). Docs: https://www.exchangerate-api.com/docs/free
        base-url: https://open.er-api.com/v6
        cache-minutes: 60
